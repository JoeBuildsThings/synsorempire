name: Keep database awake
on:
  schedule: [{ cron: "0 6 * * 1,4" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps: [
      { uses: "actions/checkout@v4" },
      {
        run: "node scripts/keepalive.mjs",
        env: {
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}",
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
        }
      }
    ]
